<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>Fullscreen Timer</title>
    <link rel="stylesheet" href="./styles.css" />
      <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Timer">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22black%22%20rx%3D%2220%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M50%2025v25l15%2015%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%2210%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22black%22%20rx%3D%2220%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M50%2025v25l15%2015%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%2210%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  </head>
  <body>
    <main class="app" aria-live="polite">
      <div id="sessionWrap" class="session-wrap" hidden>
        <span class="session-label">Session</span>
        <div id="sessionTime" class="session-time" aria-label="Session elapsed time">00:00</div>
      </div>
      <div id="time" class="time main-readout" role="timer" aria-label="Elapsed time">00:00</div>
      <div class="controls" aria-label="Timer controls">
        <button id="startPause" class="btn-primary" type="button">Start</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </main>

    <script>
      document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

      const timeEl = document.getElementById('time');
      const sessionWrapEl = document.getElementById('sessionWrap');
      const sessionTimeEl = document.getElementById('sessionTime');
      const startPauseBtn = document.getElementById('startPause');
      const resetBtn = document.getElementById('reset');

      let elapsedSeconds = 0;
      let sessionSeconds = 0;
      let running = false;
      let alignTimeoutId = null;
      let intervalId = null;
      let sessionVisible = false;

      sessionWrapEl.hidden = true;

      function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function render() {
        timeEl.textContent = formatTime(elapsedSeconds);
        sessionTimeEl.textContent = formatTime(sessionSeconds);
      }

      function stopTimers() {
        if (alignTimeoutId) {
          clearTimeout(alignTimeoutId);
          alignTimeoutId = null;
        }
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      }

      function tick() {
        if (!running) return;
        elapsedSeconds += 1;
        sessionSeconds += 1;
        render();
      }

      function start() {
        if (running) return;
        running = true;
        startPauseBtn.textContent = 'Pause';
        stopTimers();
        const delayMs = 1000 - (Date.now() % 1000);
        alignTimeoutId = setTimeout(() => {
          tick();
          intervalId = setInterval(tick, 1000);
        }, delayMs);
      }

      function pause() {
        running = false;
        startPauseBtn.textContent = 'Start';
        stopTimers();
      }

      function reset() {
        elapsedSeconds = 0;
        if (!sessionVisible) {
          sessionVisible = true;
          sessionWrapEl.hidden = false;
        }
        render();
      }

      startPauseBtn.addEventListener('click', () => {
        if (running) pause();
        else start();
      });

      resetBtn.addEventListener('click', () => {
        pause();
        reset();
      });

      render();
    </script>
  </body>
</html>
