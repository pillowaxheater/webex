<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #f1f1f1;
      --muted: #888;
      --accent: #f1f1f1;
      --accent-hover: #ccc;
      --green: #4caf50;
      --red: #f55;
      --col-gap: 20px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "YouTube Sans", Roboto, Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── SCREENS ───────────────────────────────────────── */

    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── MAIN SCREEN ──────────────────────────────────── */

    #main-screen {
      min-height: 100vh;
      padding: 32px 24px 48px;
    }

    .main-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .main-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }

    .url-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      max-width: 640px;
      margin: 0 auto;
    }

    #url-input {
      flex: 1;
      padding: 11px 18px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    #url-input:focus { border-color: #555; }
    #url-input::placeholder { color: var(--muted); }

    .btn-primary {
      padding: 11px 24px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 24px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    #url-error {
      text-align: center;
      color: var(--red);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 8px;
    }

    /* ── COLUMNS ──────────────────────────────────────── */

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--col-gap);
      margin-top: 32px;
      align-items: start;
    }

    .column {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .column-header {
      padding: 12px 16px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .column-list {
      max-height: 520px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .column-list::-webkit-scrollbar { width: 4px; }
    .column-list::-webkit-scrollbar-track { background: transparent; }
    .column-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .column-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* ── VIDEO CARD ───────────────────────────────────── */

    .video-card {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: background 0.1s;
    }

    .video-card:last-child { border-bottom: none; }
    .video-card:hover { background: rgba(255,255,255,0.04); }

    .video-card:hover .card-remove {
      opacity: 1;
    }

    .card-thumb {
      flex-shrink: 0;
      width: 100px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      background: #222;
    }

    .card-meta {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text);
    }

    .card-channel {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.7);
      border: none;
      border-radius: 50%;
      color: #aaa;
      font-size: 0.75rem;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.1s;
      padding: 0;
      font-family: inherit;
    }

    .card-remove:hover { color: var(--red); }

    /* ── PLAYER SCREEN ────────────────────────────────── */

    #player-screen {
      min-height: 100vh;
      padding: 20px 24px 40px;
    }

    .player-topbar {
      margin-bottom: 16px;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 4px 0;
      font-family: inherit;
      transition: color 0.15s;
    }

    .btn-back:hover { color: var(--text); }

    .iframe-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }

    .player-meta {
      margin-top: 14px;
    }

    #player-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
    }

    #player-channel {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .player-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn-save {
      padding: 9px 20px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .btn-save:hover:not(:disabled) {
      border-color: #555;
      background: rgba(255,255,255,0.05);
    }

    .btn-save:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .save-feedback {
      font-size: 0.8rem;
      color: var(--green);
      align-self: center;
      min-height: 1.2em;
    }

    /* ── RESPONSIVE ──────────────────────────────────── */

    @media (max-width: 680px) {
      .columns {
        grid-template-columns: 1fr;
      }

      .iframe-container {
        aspect-ratio: unset;
        height: 220px;
      }
    }
  </style>
</head>
<body>

  <!-- ── MAIN SCREEN ───────────────────────────────────── -->
  <div id="main-screen" class="screen active">
    <div class="main-header">
      <h1>YT Player</h1>
      <div class="url-row">
        <input id="url-input" type="text" placeholder="Paste YouTube URL..." autocomplete="off" spellcheck="false" />
        <button class="btn-primary" id="load-btn">Load</button>
      </div>
      <div id="url-error"></div>
    </div>

    <div class="columns">
      <div class="column" id="col-skillset">
        <div class="column-header">Skillset</div>
        <div class="column-list" id="list-skillset"></div>
      </div>
      <div class="column" id="col-general">
        <div class="column-header">General</div>
        <div class="column-list" id="list-general"></div>
      </div>
      <div class="column" id="col-history">
        <div class="column-header">History</div>
        <div class="column-list" id="list-history"></div>
      </div>
    </div>
  </div>

  <!-- ── PLAYER SCREEN ─────────────────────────────────── -->
  <div id="player-screen" class="screen">
    <div class="player-topbar">
      <button class="btn-back" id="back-btn">← Back</button>
    </div>
    <div class="iframe-container" id="iframe-container"></div>
    <div class="player-meta">
      <div id="player-title"></div>
      <div id="player-channel"></div>
    </div>
    <div class="player-actions">
      <button class="btn-save" id="save-skillset-btn">Save to Skillset</button>
      <button class="btn-save" id="save-general-btn">Save to General</button>
      <span class="save-feedback" id="save-feedback"></span>
    </div>
  </div>

  <script>
    // ── Storage keys ─────────────────────────────────────────────
    const KEYS = { skillset: 'yt_skillset', general: 'yt_general', history: 'yt_history' };

    // ── State ─────────────────────────────────────────────────────
    let currentEntry = null; // VideoEntry being played

    // ── Storage helpers ──────────────────────────────────────────

    function load(key) {
      try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
    }

    function save(key, arr) {
      localStorage.setItem(key, JSON.stringify(arr));
    }

    function getAllLists() {
      return {
        skillset: load(KEYS.skillset),
        general:  load(KEYS.general),
        history:  load(KEYS.history),
      };
    }

    function isInList(key, videoId) {
      return load(key).some(e => e.videoId === videoId);
    }

    function prependDeduped(key, entry) {
      let arr = load(key).filter(e => e.videoId !== entry.videoId);
      arr.unshift(entry);
      save(key, arr);
    }

    function removeFromList(key, videoId) {
      save(key, load(key).filter(e => e.videoId !== videoId));
    }

    // ── URL parsing ───────────────────────────────────────────────

    function extractVideoId(input) {
      input = (input || '').trim();

      const patterns = [
        // standard: youtube.com/watch?v=ID (any params before v=)
        /(?:youtube\.com|m\.youtube\.com)\/watch\?(?:[^#]*&)?v=([a-zA-Z0-9_-]{11})/,
        // short: youtu.be/ID
        /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        // shorts: youtube.com/shorts/ID
        /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
        // embed: youtube.com/embed/ID
        /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      ];

      for (const p of patterns) {
        const m = input.match(p);
        if (m) return m[1];
      }

      // Bare 11-char ID
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      return null;
    }

    // ── oEmbed fetch ──────────────────────────────────────────────

    async function fetchMeta(videoId) {
      const url = `https://www.youtube.com/oembed?url=${encodeURIComponent(
        `https://www.youtube.com/watch?v=${videoId}`
      )}&format=json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`oEmbed ${res.status}`);
      const data = await res.json();
      return { title: data.title || videoId, channel: data.author_name || '' };
    }

    function thumbUrl(videoId) {
      return `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
    }

    // ── Screen switching ──────────────────────────────────────────

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ── Render columns ────────────────────────────────────────────

    function renderColumn(listId, entries, listKey) {
      const container = document.getElementById(listId);
      container.innerHTML = '';

      if (!entries.length) {
        container.innerHTML = '<div class="column-empty">Empty</div>';
        return;
      }

      entries.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'video-card';

        const img = document.createElement('img');
        img.className = 'card-thumb';
        img.src = entry.thumbnail;
        img.alt = '';
        img.loading = 'lazy';
        // Fallback if thumbnail fails
        img.onerror = () => { img.style.background = '#222'; img.src = ''; };

        const meta = document.createElement('div');
        meta.className = 'card-meta';
        meta.innerHTML = `
          <div class="card-title">${escHtml(entry.title)}</div>
          <div class="card-channel">${escHtml(entry.channel)}</div>
        `;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'card-remove';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove';
        removeBtn.addEventListener('click', e => {
          e.stopPropagation();
          removeFromList(KEYS[listKey], entry.videoId);
          renderAll();
        });

        card.appendChild(img);
        card.appendChild(meta);
        card.appendChild(removeBtn);

        card.addEventListener('click', () => openFromEntry(entry, listKey));
        container.appendChild(card);
      });
    }

    function renderAll() {
      const { skillset, general, history } = getAllLists();
      renderColumn('list-skillset', skillset, 'skillset');
      renderColumn('list-general',  general,  'general');
      renderColumn('list-history',  history,  'history');
    }

    // ── Open video ─────────────────────────────────────────────────

    async function openVideo(videoId, existingEntry) {
      // If we already have metadata (from a card click), use it immediately
      // Otherwise show player with placeholders and fetch async
      currentEntry = existingEntry || {
        videoId,
        title: videoId,
        channel: '',
        thumbnail: thumbUrl(videoId),
        timestamp: Date.now(),
      };

      // Add to history if not in a playlist
      if (!isInList(KEYS.skillset, videoId) && !isInList(KEYS.general, videoId)) {
        prependDeduped(KEYS.history, { ...currentEntry, timestamp: Date.now() });
      }

      // Switch screen and inject player
      showScreen('player-screen');
      injectIframe(videoId);

      // Populate meta
      document.getElementById('player-title').textContent = currentEntry.title;
      document.getElementById('player-channel').textContent = currentEntry.channel;
      updateSaveButtons();
      document.getElementById('save-feedback').textContent = '';

      // Fetch better metadata if we don't have a real title yet
      if (!existingEntry || existingEntry.title === videoId) {
        try {
          const meta = await fetchMeta(videoId);
          currentEntry.title = meta.title;
          currentEntry.channel = meta.channel;
          currentEntry.thumbnail = thumbUrl(videoId);
          document.getElementById('player-title').textContent = meta.title;
          document.getElementById('player-channel').textContent = meta.channel;
          // Update stored entry with real title
          updateEntryInStorage(currentEntry);
        } catch (_) {
          // Non-fatal — player still works
        }
      }

      renderAll();
    }

    function openFromEntry(entry, _listKey) {
      openVideo(entry.videoId, entry);
    }

    function updateEntryInStorage(entry) {
      // Update in whichever lists the entry appears in
      [KEYS.skillset, KEYS.general, KEYS.history].forEach(key => {
        const arr = load(key);
        const idx = arr.findIndex(e => e.videoId === entry.videoId);
        if (idx !== -1) {
          arr[idx] = { ...arr[idx], ...entry };
          save(key, arr);
        }
      });
    }

    function injectIframe(videoId) {
      const container = document.getElementById('iframe-container');
      container.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&autoplay=1`;
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;
      container.appendChild(iframe);
    }

    function clearIframe() {
      document.getElementById('iframe-container').innerHTML = '';
    }

    // ── Save to playlist ───────────────────────────────────────────

    function saveToPlaylist(listKey) {
      if (!currentEntry) return;
      const entry = { ...currentEntry, timestamp: Date.now() };
      // Remove from history first
      removeFromList(KEYS.history, entry.videoId);
      // Add to playlist (deduped)
      prependDeduped(KEYS[listKey], entry);
      updateSaveButtons();
      document.getElementById('save-feedback').textContent = `Saved to ${listKey.charAt(0).toUpperCase() + listKey.slice(1)}`;
      setTimeout(() => {
        const fb = document.getElementById('save-feedback');
        if (fb) fb.textContent = '';
      }, 2000);
      renderAll();
    }

    function updateSaveButtons() {
      if (!currentEntry) return;
      document.getElementById('save-skillset-btn').disabled = isInList(KEYS.skillset, currentEntry.videoId);
      document.getElementById('save-general-btn').disabled  = isInList(KEYS.general,  currentEntry.videoId);
    }

    // ── URL load flow ──────────────────────────────────────────────

    async function handleUrlLoad() {
      const input = document.getElementById('url-input').value;
      const errorEl = document.getElementById('url-error');
      errorEl.textContent = '';

      const videoId = extractVideoId(input);
      if (!videoId) {
        errorEl.textContent = 'Could not find a YouTube video ID in that URL.';
        return;
      }

      document.getElementById('url-input').value = '';
      await openVideo(videoId, null);
    }

    // ── Utility ────────────────────────────────────────────────────

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Event listeners ────────────────────────────────────────────

    document.getElementById('load-btn').addEventListener('click', handleUrlLoad);

    document.getElementById('url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleUrlLoad();
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      clearIframe();
      currentEntry = null;
      showScreen('main-screen');
      renderAll();
    });

    document.getElementById('save-skillset-btn').addEventListener('click', () => saveToPlaylist('skillset'));
    document.getElementById('save-general-btn').addEventListener('click',  () => saveToPlaylist('general'));

    // ── Init ────────────────────────────────────────────────────────

    renderAll();
  </script>
</body>
</html>
