<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
        />
        <title>QR Code Generator</title>
        <link rel="stylesheet" href="./styles.css" />
        <style>
            .qr-input-container {
                display: flex;
                width: min(520px, 100%);
            }

            input[type="url"],
            input[type="text"] {
                flex: 1;
                min-height: 5rem;
                border: none;
                border-radius: 0;
                background: rgba(255, 255, 255, 0.06);
                color: #ffffff;
                font-size: clamp(1.1rem, 4.5vw, 1.5rem);
                font-family: inherit;
                padding: 0 1.5rem;
                outline: none;
                text-align: center;
            }

            input::placeholder {
                color: rgba(255, 255, 255, 0.3);
            }

            .qr-display {
                width: min(320px, 80vw);
                height: min(320px, 80vw);
                background: rgba(255, 255, 255, 0.06);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .qr-display img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }
        </style>
    </head>
    <body>
        <main class="app" aria-live="polite">
            <div
                class="qr-display"
                id="qrContainer"
                aria-label="QR Code Display"
                hidden
            >
                <!-- QR Code will appear here -->
            </div>

            <div class="qr-input-container" aria-label="QR Code Input">
                <input
                    type="text"
                    id="qrInput"
                    placeholder="insert link / enter text"
                    autocomplete="off"
                />
            </div>

            <div class="controls" aria-label="QR Code Actions">
                <button
                    id="downloadBtn"
                    type="button"
                    class="btn-primary"
                    hidden
                >
                    Download PNG
                </button>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
        <script>
            const qrInput = document.getElementById("qrInput");
            const qrContainer = document.getElementById("qrContainer");
            const downloadBtn = document.getElementById("downloadBtn");

            let currentDataUrl = null;

            function generateQR() {
                const text = qrInput.value.trim();

                if (!text) {
                    qrContainer.innerHTML = "";
                    qrContainer.hidden = true;
                    downloadBtn.hidden = true;
                    currentDataUrl = null;
                    return;
                }

                // Generate high-res QR code
                QRCode.toDataURL(
                    text,
                    {
                        width: 1024,
                        margin: 2,
                        color: {
                            dark: "#000000",
                            light: "#ffffff",
                        },
                    },
                    (err, url) => {
                        if (err) {
                            console.error(err);
                            return;
                        }
                        currentDataUrl = url;
                        qrContainer.innerHTML = `<img src="${url}" alt="QR Code" />`;
                        qrContainer.hidden = false;
                        downloadBtn.hidden = false;
                    },
                );
            }

            let timeout;
            qrInput.addEventListener("input", () => {
                clearTimeout(timeout);
                timeout = setTimeout(generateQR, 250);
            });

            downloadBtn.addEventListener("click", () => {
                if (!currentDataUrl) return;

                const text = qrInput.value.trim();
                let namePart = "code";
                try {
                    // Attempt to extract the primary domain name for URLs
                    const url = new URL(text);
                    const parts = url.hostname
                        .replace(/^www\./i, "")
                        .split(".");
                    namePart =
                        parts.length > 1 ? parts[parts.length - 2] : parts[0];
                } catch (e) {
                    // If not a URL, use a sanitized version of the text
                    namePart =
                        text
                            .replace(/[^a-zA-Z0-9]/g, "-")
                            .replace(/-+/g, "-")
                            .substring(0, 15)
                            .replace(/^-|-$/g, "") || "text";
                }

                const now = new Date();
                const dateStr =
                    String(now.getDate()).padStart(2, "0") +
                    String(now.getMonth() + 1).padStart(2, "0");
                const filename = `QR-${namePart}-${dateStr}.png`;

                const link = document.createElement("a");
                link.href = currentDataUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        </script>
    </body>
</html>
