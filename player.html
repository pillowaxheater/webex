<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #f1f1f1;
      --muted: #888;
      --accent: #f1f1f1;
      --accent-hover: #ccc;
      --green: #4caf50;
      --red: #f55;
      --col-gap: 20px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "YouTube Sans", Roboto, Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── SCREENS ───────────────────────────────────────── */

    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── MAIN SCREEN ──────────────────────────────────── */

    #main-screen {
      min-height: 100vh;
      padding: 32px 24px 48px;
    }

    .main-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .main-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }

    .url-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      max-width: 640px;
      margin: 0 auto;
    }

    #url-input {
      flex: 1;
      padding: 11px 18px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    #url-input:focus { border-color: #555; }
    #url-input::placeholder { color: var(--muted); }

    .btn-primary {
      padding: 11px 24px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 24px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    #url-error {
      text-align: center;
      color: var(--red);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 8px;
    }

    /* ── COLUMNS ──────────────────────────────────────── */

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--col-gap);
      margin-top: 32px;
      align-items: start;
    }

    .column {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .column-header {
      padding: 12px 16px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .column-list {
      max-height: 520px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .column-list::-webkit-scrollbar { width: 4px; }
    .column-list::-webkit-scrollbar-track { background: transparent; }
    .column-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .column-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* ── VIDEO CARD ───────────────────────────────────── */

    .video-card {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: background 0.1s;
    }

    .video-card:last-child { border-bottom: none; }
    .video-card:hover { background: rgba(255,255,255,0.04); }

    .video-card:hover .card-remove {
      opacity: 1;
    }

    .card-thumb {
      flex-shrink: 0;
      width: 100px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      background: #222;
    }

    .card-meta {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text);
    }

    .card-channel {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.7);
      border: none;
      border-radius: 50%;
      color: #aaa;
      font-size: 0.75rem;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.1s;
      padding: 0;
      font-family: inherit;
    }

    .card-remove:hover { color: var(--red); }

    /* ── PLAYER SCREEN ────────────────────────────────── */

    #player-screen {
      min-height: 100vh;
      padding: 20px 24px 40px;
    }

    .player-topbar {
      margin-bottom: 16px;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 4px 0;
      font-family: inherit;
      transition: color 0.15s;
    }

    .btn-back:hover { color: var(--text); }

    .iframe-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-meta {
      margin-top: 14px;
    }

    #player-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .player-sub {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    #player-channel {
      font-size: 0.85rem;
      color: var(--muted);
    }

    #player-duration {
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-variant-numeric: tabular-nums;
    }

    .player-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn-save {
      padding: 9px 20px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .btn-save:hover:not(:disabled) {
      border-color: #555;
      background: rgba(255,255,255,0.05);
    }

    .btn-save:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .save-feedback {
      font-size: 0.8rem;
      color: var(--green);
      align-self: center;
      min-height: 1.2em;
    }

    /* ── RESPONSIVE ──────────────────────────────────── */

    @media (max-width: 680px) {
      .columns {
        grid-template-columns: 1fr;
      }

      .iframe-container {
        aspect-ratio: unset;
        height: 220px;
      }
    }
  </style>
</head>
<body>

  <!-- ── MAIN SCREEN ───────────────────────────────────── -->
  <div id="main-screen" class="screen active">
    <div class="main-header">
      <h1>deplatformed</h1>
      <div class="url-row">
        <input id="url-input" type="text" placeholder="Paste YouTube URL..." autocomplete="off" spellcheck="false" />
        <button class="btn-primary" id="load-btn">Load</button>
      </div>
      <div id="url-error"></div>
    </div>

    <div class="columns">
      <div class="column" id="col-skillset">
        <div class="column-header">Skillset</div>
        <div class="column-list" id="list-skillset"></div>
      </div>
      <div class="column" id="col-general">
        <div class="column-header">General</div>
        <div class="column-list" id="list-general"></div>
      </div>
      <div class="column" id="col-history">
        <div class="column-header">History</div>
        <div class="column-list" id="list-history"></div>
      </div>
    </div>
  </div>

  <!-- ── PLAYER SCREEN ─────────────────────────────────── -->
  <div id="player-screen" class="screen">
    <div class="player-topbar">
      <button class="btn-back" id="back-btn">← Back</button>
    </div>
    <div class="iframe-container" id="iframe-container"></div>
    <div class="player-meta">
      <div id="player-title"></div>
      <div class="player-sub">
        <span id="player-channel"></span>
        <span id="player-duration"></span>
      </div>
    </div>
    <div class="player-actions">
      <button class="btn-save" id="save-skillset-btn">Save to Skillset</button>
      <button class="btn-save" id="save-general-btn">Save to General</button>
      <span class="save-feedback" id="save-feedback"></span>
    </div>
  </div>

  <script>
    // ── Storage ───────────────────────────────────────────────────
    const KEYS = { skillset: 'yt_skillset', general: 'yt_general', history: 'yt_history' };
    let currentEntry = null;
    let ytAPILoading = false;

    function load(key) {
      try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
    }
    function save(key, arr) { localStorage.setItem(key, JSON.stringify(arr)); }
    function getAllLists() {
      return { skillset: load(KEYS.skillset), general: load(KEYS.general), history: load(KEYS.history) };
    }
    function isInList(key, videoId) { return load(key).some(e => e.videoId === videoId); }
    function prependDeduped(key, entry) {
      const arr = load(key).filter(e => e.videoId !== entry.videoId);
      arr.unshift(entry);
      save(key, arr);
    }
    function removeFromList(key, videoId) { save(key, load(key).filter(e => e.videoId !== videoId)); }

    // ── URL parsing ───────────────────────────────────────────────
    function extractVideoId(input) {
      input = (input || '').trim();
      const patterns = [
        /(?:youtube\.com|m\.youtube\.com)\/watch\?(?:[^#]*&)?v=([a-zA-Z0-9_-]{11})/,
        /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      ];
      for (const p of patterns) { const m = input.match(p); if (m) return m[1]; }
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      return null;
    }

    // ── oEmbed ────────────────────────────────────────────────────
    async function fetchOEmbed(videoId) {
      const res = await fetch(
        `https://www.youtube.com/oembed?url=${encodeURIComponent(
          'https://www.youtube.com/watch?v=' + videoId
        )}&format=json`
      );
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }

    function thumbUrl(id) { return `https://img.youtube.com/vi/${id}/mqdefault.jpg`; }

    // ── Duration formatting ───────────────────────────────────────
    function formatDuration(secs) {
      secs = Math.floor(secs);
      const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      return `${m}:${String(s).padStart(2,'0')}`;
    }

    // ── Plain iframe (works everywhere) ───────────────────────────
    function injectIframe(videoId) {
      const c = document.getElementById('iframe-container');
      c.innerHTML = '';
      const f = document.createElement('iframe');
      f.id = 'yt-iframe';
      // enablejsapi=1 lets the IFrame API attach to this iframe for duration
      f.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&enablejsapi=1&playsinline=1`;
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      f.allowFullscreen = true;
      c.appendChild(f);
    }

    // ── Optional: IFrame API for duration only ────────────────────
    // Loaded lazily after iframe is injected; gracefully skipped if unavailable
    window.onYouTubeIframeAPIReady = function () {
      const iframe = document.getElementById('yt-iframe');
      if (!iframe || !currentEntry) return;
      const targetId = currentEntry.videoId;
      try {
        new YT.Player('yt-iframe', {
          events: {
            onReady: (e) => {
              const dur = e.target.getDuration();
              if (dur > 0 && currentEntry && currentEntry.videoId === targetId) {
                document.getElementById('player-duration').textContent = formatDuration(dur);
              }
            },
            onStateChange: (e) => {
              if (e.data === 1) { // PLAYING — fires after loadVideoById or initial play
                const dur = e.target.getDuration();
                if (dur > 0) document.getElementById('player-duration').textContent = formatDuration(dur);
              }
            }
          }
        });
      } catch (_) {}
    };

    function loadYTAPI() {
      if (ytAPILoading || document.querySelector('script[src*="iframe_api"]')) return;
      ytAPILoading = true;
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }

    // ── Screens ───────────────────────────────────────────────────
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ── Columns ───────────────────────────────────────────────────
    function renderColumn(listId, entries, listKey) {
      const c = document.getElementById(listId);
      c.innerHTML = '';
      if (!entries.length) { c.innerHTML = '<div class="column-empty">Empty</div>'; return; }
      entries.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'video-card';

        const img = document.createElement('img');
        img.className = 'card-thumb';
        img.src = entry.thumbnail;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = () => { img.src = ''; img.style.background = '#222'; };

        const meta = document.createElement('div');
        meta.className = 'card-meta';
        meta.innerHTML = `<div class="card-title">${escHtml(entry.title)}</div>
          <div class="card-channel">${escHtml(entry.channel)}</div>`;

        const rm = document.createElement('button');
        rm.className = 'card-remove';
        rm.textContent = '×';
        rm.title = 'Remove';
        rm.addEventListener('click', e => {
          e.stopPropagation();
          removeFromList(KEYS[listKey], entry.videoId);
          renderAll();
        });

        card.appendChild(img);
        card.appendChild(meta);
        card.appendChild(rm);
        card.addEventListener('click', () => openFromEntry(entry));
        c.appendChild(card);
      });
    }

    function renderAll() {
      const { skillset, general, history } = getAllLists();
      renderColumn('list-skillset', skillset, 'skillset');
      renderColumn('list-general',  general,  'general');
      renderColumn('list-history',  history,  'history');
    }

    // ── Open video ────────────────────────────────────────────────
    async function openVideo(videoId, existingEntry) {
      // 1. Fetch metadata FIRST so we never show "Loading..."
      let title = existingEntry ? existingEntry.title : null;
      let channel = existingEntry ? existingEntry.channel : null;

      if (!title) {
        try {
          const d = await fetchOEmbed(videoId);
          title = d.title || videoId;
          channel = d.author_name || '';
        } catch (_) {
          title = videoId;
          channel = '';
        }
      }

      currentEntry = {
        videoId,
        title,
        channel,
        thumbnail: thumbUrl(videoId),
        timestamp: Date.now(),
      };

      // 2. Track history
      if (!isInList(KEYS.skillset, videoId) && !isInList(KEYS.general, videoId)) {
        prependDeduped(KEYS.history, { ...currentEntry });
      } else {
        updateEntryInStorage(currentEntry); // refresh title if changed
      }

      // 3. Show player with correct info immediately — no placeholder
      showScreen('player-screen');
      document.getElementById('player-title').textContent = title;
      document.getElementById('player-channel').textContent = channel;
      document.getElementById('player-duration').textContent = '';
      document.getElementById('save-feedback').textContent = '';
      updateSaveButtons();

      // 4. Inject plain iframe (always works, even from file://)
      injectIframe(videoId);

      // 5. Load IFrame API in background to get duration (optional, HTTP only)
      loadYTAPI();

      renderAll();
    }

    function openFromEntry(entry) { openVideo(entry.videoId, entry); }

    function updateEntryInStorage(entry) {
      [KEYS.skillset, KEYS.general, KEYS.history].forEach(key => {
        const arr = load(key);
        const idx = arr.findIndex(e => e.videoId === entry.videoId);
        if (idx !== -1) { arr[idx] = { ...arr[idx], ...entry }; save(key, arr); }
      });
    }

    // ── Save / buttons ────────────────────────────────────────────
    function saveToPlaylist(listKey) {
      if (!currentEntry) return;
      removeFromList(KEYS.history, currentEntry.videoId);
      prependDeduped(KEYS[listKey], { ...currentEntry, timestamp: Date.now() });
      updateSaveButtons();
      document.getElementById('save-feedback').textContent =
        `Saved to ${listKey === 'skillset' ? 'Skillset' : 'General'}`;
      setTimeout(() => { const fb = document.getElementById('save-feedback'); if (fb) fb.textContent = ''; }, 2000);
      renderAll();
    }

    function updateSaveButtons() {
      if (!currentEntry) return;
      document.getElementById('save-skillset-btn').disabled = isInList(KEYS.skillset, currentEntry.videoId);
      document.getElementById('save-general-btn').disabled  = isInList(KEYS.general,  currentEntry.videoId);
    }

    // ── URL load ──────────────────────────────────────────────────
    async function handleUrlLoad() {
      const input = document.getElementById('url-input').value;
      const errorEl = document.getElementById('url-error');
      errorEl.textContent = '';
      const videoId = extractVideoId(input);
      if (!videoId) { errorEl.textContent = 'Could not find a YouTube video ID in that URL.'; return; }
      document.getElementById('url-input').value = '';
      await openVideo(videoId, null);
    }

    // ── Utility ───────────────────────────────────────────────────
    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Events ────────────────────────────────────────────────────
    document.getElementById('load-btn').addEventListener('click', handleUrlLoad);
    document.getElementById('url-input').addEventListener('keydown', e => { if (e.key === 'Enter') handleUrlLoad(); });
    document.getElementById('back-btn').addEventListener('click', () => {
      document.getElementById('iframe-container').innerHTML = '';
      currentEntry = null;
      showScreen('main-screen');
      renderAll();
    });
    document.getElementById('save-skillset-btn').addEventListener('click', () => saveToPlaylist('skillset'));
    document.getElementById('save-general-btn').addEventListener('click',  () => saveToPlaylist('general'));

    renderAll();
  </script>
</body>
</html>
